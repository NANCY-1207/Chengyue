<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>誠悅蒙特梭利幼兒園 - 幼兒園最新消息</title>

    <!-- 1. Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- 2. Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- 3. 引入主樣式表 (修正路徑) -->
    <link href="../css/style.css" rel="stylesheet" />

    <!-- 4. 引入幼兒園專用樣式 (修正路徑) -->
    <link href="../css/Kindergarten.css" rel="stylesheet" />

    <style>
      /* 本頁專屬樣式 */
      .content-area {
        padding-top: 40px;
        min-height: 600px;
      }
      .page-title {
        color: #003366;
        font-weight: 700;
        border-bottom: 3px solid #ff6600;
        padding-bottom: 10px;
        margin-bottom: 30px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <!-- Header 容器 -->
    <div id="divHeader"></div>

    <!-- 主要內容區 -->
    <main class="container content-area">
      <div class="row">
        <div class="col-12">
          <h1 class="page-title">幼兒園最新消息</h1>

          <!-- 內容區塊 (範例資料) -->
          <div class="list-group">
            <a
              href="#"
              class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            >
              <div>
                <span class="badge bg-primary rounded-pill me-2">餐點</span>
                JOY誠悅五月份餐點表
              </div>
              <small class="text-muted">2024/04/30</small>
            </a>
            <a
              href="#"
              class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            >
              <div>
                <span class="badge bg-success rounded-pill me-2">活動</span>
                JOY誠悅五月份活動公告
              </div>
              <small class="text-muted">2024/04/30</small>
            </a>
            <a
              href="#"
              class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
            >
              <div>
                <span class="badge bg-warning text-dark rounded-pill me-2"
                  >重要</span
                >
                腸病毒預防宣導事項
              </div>
              <small class="text-muted">2024/11/28</small>
            </a>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer 容器 (補上 Footer) -->
    <div id="divFooter"></div>

    <!-- JS 載入 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      $(document).ready(function () {
        // [修正] 載入 Header
        $("#divHeader").load(
          "Kindergartenheader.html",
          function (response, status, xhr) {
            if (status == "error") {
              // Fallback
              $("#divHeader").load("../header.html");
            } else {
              // 自動調整圖片與連結路徑
              setTimeout(function () {
                $("#divHeader a.navbar-brand").attr("href", "../index.html");
                $("#divHeader img").each(function () {
                  var src = $(this).attr("src");
                  if (src && src.indexOf("./") === 0) {
                    $(this).attr("src", "." + src);
                  }
                });
                // Active 狀態
                $("#divHeader .nav-link").each(function () {
                  var href = $(this).attr("href");
                  if (href && window.location.href.indexOf(href) > -1) {
                    $(this).addClass("active");
                  }
                });
              }, 50);
            }
          }
        );

        // [修正] 載入 Footer
        $("#divFooter").load("../foot.html", function (response, status, xhr) {
          if (status == "error") {
            $("#divFooter").load("foot.html");
          } else {
            // 自動調整圖片路徑
            setTimeout(function () {
              $("#divFooter img").each(function () {
                var src = $(this).attr("src");
                if (src.indexOf("./") === 0) {
                  $(this).attr("src", "." + src);
                }
              });
            }, 50);
          }
        });

        // 頁面淡入
        document.body.style.opacity = 1;
      });
    </script>
  </body>
</html>
