<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>誠悅蒙特梭利幼兒園 - 日常生活教育/感官發展教育</title>

    <!-- 1. Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- 2. Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- 3. 引入主樣式表 -->
    <link href="../css/style.css" rel="stylesheet" />

    <!-- 4. 幼兒園專用樣式 (保留) -->
    <link rel="stylesheet" href="../css/Kindergarten.css" />

    <style>
      /* 本頁專屬樣式 - 保留舊顏色，但調整版面結構 */

      .content-area {
        padding-top: 0;
        padding-bottom: 0;
        min-height: 600px;
      }

      .page-title-wrapper {
        padding-top: 40px;
        padding-bottom: 20px;
        text-align: center;
      }

      .page-title {
        color: #003366; /* 舊版深藍 */
        font-weight: 700;
        border-bottom: 3px solid #ff6600; /* 舊版橘色 */
        padding-bottom: 10px;
        margin-bottom: 30px;
        display: inline-block;
      }

      /* 區塊包裝 (背景色保留) */
      .section-wrapper {
        padding: 60px 0;
        margin-bottom: 30px;
        border-radius: 20px; /* 加入圓角讓版面柔和 */
      }

      .bg-light-pink {
        background-color: #fff0f3; /* 淡粉色 (日常生活) */
      }

      .bg-light-cyan {
        background-color: #e0f7fa; /* 淡青色 (感官教育) */
      }

      /* 副標題樣式 (保留舊版綠色與裝飾) */
      .feature-subtitle {
        color: #1d7a57; /* 舊版深綠 */
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
      }

      .feature-subtitle::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 24px;
        background-color: #ff6600; /* 舊版橘色 */
        margin-right: 15px;
        border-radius: 2px;
      }

      .feature-text {
        font-size: 1.15rem;
        line-height: 2;
        color: #555;
        text-align: justify;
        margin-bottom: 1.5rem;
      }

      .highlight {
        color: #ff6600; /* 舊版橘色 */
        font-weight: 600;
      }

      /* 動作關鍵字 (握拿捏) - 保留舊樣式 */
      .action-tag {
        display: inline-block;
        background-color: #fff;
        border: 1px solid #ffccbc;
        color: #d84315;
        padding: 4px 15px;
        border-radius: 20px;
        font-weight: 700;
        margin: 0 4px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      /* 感官關鍵字 (大小高低) - 保留舊樣式 */
      .sense-tag {
        display: inline-block;
        background-color: #fff;
        border: 1px solid #b2dfdb;
        color: #00695c;
        padding: 4px 12px;
        border-radius: 20px;
        font-weight: 700;
        margin: 3px 2px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      /* 圖片樣式 (統一規格，但移除邊框顏色設定，改用白底) */
      .course-img {
        width: 100%;
        height: 350px; /* 固定高度 */
        object-fit: contain; /* 完整顯示 */
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border: 4px solid #fff;
        background-color: #fff;
      }

      /* 響應式調整 */
      @media (max-width: 768px) {
        .course-img {
          height: 250px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header 容器 -->
    <div id="divHeader"></div>

    <!-- 頁面標題區 -->
    <div class="container page-title-wrapper">
      <div class="row justify-content-center">
        <div class="col-12 text-center text-md-start">
          <h1 class="page-title">日常生活教育 / 感官發展教育</h1>
        </div>
      </div>
    </div>

    <!-- 主要內容區 -->
    <main class="content-area container mb-5">
      <!-- ========================================== -->
      <!-- 1. 日常生活教育 (淡粉底) -> 圖片在右 -->
      <!-- ========================================== -->
      <section class="section-wrapper bg-light-pink">
        <div class="container">
          <div class="row align-items-center g-5">
            <!-- 文字區塊 (左) -->
            <div class="col-lg-6">
              <h2 class="feature-subtitle">日常生活教育</h2>
              <p class="feature-text">
                透過真實的教具，小朋友們在探索的過程中，不斷的反覆練習：
                <br class="d-md-none" /></br>
                <span class="action-tag">握</span>
                <span class="action-tag">拿</span>
                <span class="action-tag">捏</span>
              </p>
              <p class="feature-text">
                這樣的練習進而促進小朋友們的<span class="highlight"
                  >小肌肉發展</span
                >與末梢神經的靈敏。使其筋肉記憶在小朋友下一個階段的成熟期時，能逐步達到手眼協調能力，這更是進入小學前<span
                  class="highlight"
                  >書寫的重要準備</span
                >。
              </p>
            </div>

            <!-- 圖片區塊 (右) -->
            <div class="col-lg-6 text-center">
              <!-- [修改] 替換為實際圖片 -->
              <img
                src="../image/日常生活教育.jpg"
                alt="日常生活教育"
                class="course-img"
              />
            </div>
          </div>
        </div>
      </section>

      <!-- ========================================== -->
      <!-- 2. 感官發展教育 (淡青底) -> 圖片在左 -->
      <!-- ========================================== -->
      <section class="section-wrapper bg-light-cyan">
        <div class="container">
          <div class="row align-items-center g-5">
            <!-- 圖片區塊 (左：使用 order-lg-1 確保桌面版在左) -->
            <div class="col-lg-6 order-lg-1 text-center">
              <!-- [修改] 替換為實際圖片 -->
              <img
                src="../image/感官發展教育.jpg"
                alt="感官教育"
                class="course-img"
              />
            </div>

            <!-- 文字區塊 (右：使用 order-lg-2) -->
            <div class="col-lg-6 order-lg-2">
              <h2 class="feature-subtitle">開啟孩子的（感官）世界</h2>

              <p class="feature-text">蒙特梭利感官教具從量的型體開始：</p>

              <div class="mb-3">
                <span class="sense-tag">大</span>
                <span class="sense-tag">小</span>
                <span class="sense-tag">胖</span>
                <span class="sense-tag">瘦</span>
                <span class="sense-tag">高</span>
                <span class="sense-tag">低</span>
              </div>

              <p class="feature-text">
                進而透過<span class="highlight">觸覺</span>產生可以理解的<span
                  class="highlight"
                  >三度空間</span
                >概念。從視覺與觸覺的結合，產生量體形體的邏輯與顏色變化，為下一階段的成長期與數學邏輯思維做好準備。
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 頁尾容器 -->
    <div id="divFooter"></div>

    <!-- JS 載入 -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      $(document).ready(function () {
        // [修正] 載入 Header
        // 因為本頁面和 Kindergartenheader.html 都在 Kindergarten/ 資料夾下
        // 所以直接載入檔名即可，不需要路徑前綴
        $("#divHeader").load(
          "Kindergartenheader.html",
          function (response, status, xhr) {
            if (status == "error") {
              console.log(
                "Error loading Kindergartenheader.html: " +
                  xhr.status +
                  " " +
                  xhr.statusText
              );
              // 如果失敗，嘗試往上一層找通用 header (fallback)
              $("#divHeader").load("../header.html");
            } else {
              // [關鍵修正] 自動調整 Header 內的圖片與連結路徑
              // 因為 Header 原本是為根目錄設計的，圖片路徑通常是 ./image/...
              //但在子資料夾 (Kindergarten/) 中，需要改為 ../image/...
              setTimeout(function () {
                // 1. 修正 Logo 連結回首頁
                $("#divHeader a.navbar-brand").attr("href", "../index.html");

                // 2. 修正所有圖片路徑
                $("#divHeader img").each(function () {
                  var src = $(this).attr("src");
                  // 如果路徑是 ./ 開頭，改為 ../ (回到上一層)
                  if (src && src.indexOf("./") === 0) {
                    $(this).attr("src", "." + src); // 變成 ../image/...
                  }
                });

                // 3. 修正導覽列連結 (如果 Header 裡是用相對路徑)
                $("#divHeader .nav-link").each(function () {
                  var href = $(this).attr("href");
                  // 讓當前頁面的連結亮起 (Active 狀態)
                  if (href && window.location.href.indexOf(href) > -1) {
                    $(this).addClass("active");
                  }
                });
              }, 50);
            }
          }
        );

        // [修正] 載入 Footer
        $("#divFooter").load("../foot.html", function (response, status, xhr) {
          if (status == "error") {
            // fallback
            $("#divFooter").load("foot.html");
          } else {
            // 同樣修正 Footer 圖片路徑
            setTimeout(function () {
              $("#divFooter img").each(function () {
                var src = $(this).attr("src");
                if (src && src.indexOf("./") === 0) {
                  $(this).attr("src", "." + src);
                }
              });
            }, 50);
          }
        });

        // 頁面淡入
        document.body.style.opacity = 1;
      });
    </script>
  </body>
</html>
